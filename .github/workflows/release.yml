name: Build & Publish Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release version tag (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK licenses
        run: |
          SDK_MANAGER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDK_MANAGER" ]; then
            yes | "$SDK_MANAGER" --licenses > /dev/null 2>&1 || true
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate signing secrets & decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PWD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PWD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$STORE_PWD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PWD" ]; then
            echo "::error::Missing signing secrets. Please configure RELEASE_KEYSTORE_BASE64, RELEASE_STORE_PASSWORD, RELEASE_KEY_ALIAS, and RELEASE_KEY_PASSWORD in GitHub Repository Secrets."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 --decode > "${{ runner.temp }}/release.jks"

      - name: Resolve version info
        id: version
        run: |
          TAG="${{ github.event.inputs.version_tag || github.ref_name }}"
          CLEAN_VER="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$CLEAN_VER" >> "$GITHUB_OUTPUT"

      - name: Run unit tests and build signed release APK
        env:
          SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          APP_VERSION_NAME: ${{ steps.version.outputs.version }}
          APP_VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleRelease --no-daemon --stacktrace

      - name: Package release artifacts
        id: pkg
        run: |
          VER="${{ steps.version.outputs.version }}"
          OUT_APK="TJ-Hub-v${VER}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$OUT_APK"
          sha256sum "$OUT_APK" > "${OUT_APK}.sha256"
          echo "apk=$OUT_APK" >> "$GITHUB_OUTPUT"
          echo "sha=${OUT_APK}.sha256" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "TJ Hub ${{ steps.version.outputs.tag }}"
          generate_release_notes: true
          files: |
            ${{ steps.pkg.outputs.apk }}
            ${{ steps.pkg.outputs.sha }}
